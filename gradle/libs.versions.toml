[versions]
sdk = "1.2.0"
wear-services = "1.1.0"
wear-util = "1.0.2"
edc = "1.3.7"
bon = "1.4.3"
bluetooth = "2.2.2"
kf = "1.6.1"
bluetooth-util = "2.0.0"
logging = "1.2.1"
io = "1.2.1"
collections = "1.4.2"
microui = "3.1.1"
microvg = "1.1.1"
drawing = "1.0.5"
mwt = "3.5.5"
widget = "5.2.1"
motion = "4.0.1"
time = "1.1.1"
basictool = "1.7.0"

[libraries]
microej-veewear-services = { group = "com.microej.library.wear", name = "wear-services", version.ref = "wear-services" }
microej-veewear-util = { group = "com.microej.library.wear", name = "wear-util", version.ref = "wear-util" }
microej-edc = { group = "ej.api", name = "edc", version.ref = "edc" }
microej-bon = { group = "ej.api", name = "bon", version.ref = "bon" }
microej-bluetooth = { group = "ej.api", name = "bluetooth", version.ref = "bluetooth" }
microej-kf = { group = "ej.api", name = "kf", version.ref = "kf" }
microej-bluetooth-util = { group = "ej.library.iot", name = "bluetooth-util", version.ref = "bluetooth-util" }
microej-logging = { group = "ej.library.eclasspath", name = "logging", version.ref = "logging" }
microej-io = { group = "ej.library.eclasspath", name = "io", version.ref = "io" }
microej-collections = { group = "ej.library.eclasspath", name = "collections", version.ref = "collections" }
microej-microui = { group = "ej.api", name = "microui", version.ref = "microui" }
microej-microvg = { group = "ej.api", name = "microvg", version.ref = "microvg" }
microej-drawing = { group = "ej.api", name = "drawing", version.ref = "drawing" }
microej-mwt = { group = "ej.library.ui", name = "mwt", version.ref = "mwt" }
microej-widget = { group = "ej.library.ui", name = "widget", version.ref = "widget" }
microej-motion = { group = "ej.library.ui", name = "motion", version.ref = "motion" }
microej-time = { group = "ej.library.eclasspath", name = "time", version.ref = "time" }
microej-basictool = { group = "ej.library.runtime", name = "basictool", version.ref = "basictool" }

[plugins]
microej-application = { id = "com.microej.gradle.application", version.ref = "sdk" }
